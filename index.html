<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker PPL</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Tracker de Entrenamiento</h2>
      
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tab-push" onclick="setTab('push')">Push</button>
        <button type="button" class="tab-btn" id="tab-pull" onclick="setTab('pull')">Pull</button>
        <button type="button" class="tab-btn" id="tab-legs" onclick="setTab('legs')">Legs</button>
      </div>

      <div class="input-section">
        <div class="input-group">
          <label for="exercise">Ejercicio</label>
          <select id="exercise" onchange="updateChart()">
          </select>
        </div>

        <div class="row">
          <div class="input-group">
            <label for="weight">Peso (kg) <span style="font-size: 10px; color: #64748b;">(Opcional)</span></label>
            <input type="number" id="weight" min="0" step="0.5" placeholder="Vacío = Corporal">
          </div>
          <div class="input-group">
            <label for="reps">Repeticiones</label>
            <input type="number" id="reps" min="1" step="1" placeholder="Ej: 10">
          </div>
        </div>

        <div class="input-group">
          <label for="notes">Notas / Sensaciones <span style="font-size: 10px; color: #64748b;">(Opcional)</span></label>
          <input type="text" id="notes" placeholder="Ej: RPE 8, me dolió el hombro, subir peso...">
        </div>

        <button type="button" class="btn-save" onclick="saveSet()">Guardar Serie</button>
      </div>

      <div class="chart-container">
        <canvas id="prChart"></canvas>
      </div>

      <div class="history-section">
        <h3>Últimas Series <button type="button" class="btn-clear" onclick="clearHistory()">Borrar todo</button></h3>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Ejercicio</th>
                <th>Peso</th>
                <th>Reps</th>
              </tr>
            </thead>
            <tbody id="history-body">
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js?v=3"></script>
</body>
</html>
